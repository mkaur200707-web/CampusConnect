<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusConnect | Register</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="register-page">


    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="index.html" class="logo">
            Campus<span>Connect</span>
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- REGISTER -->

    <main class="register-wrapper">

        <section class="register-card">


            <!-- LOGO -->

            <div class="register-university-logo">

                <img
                    src="images/chitkara-logo.png"
                    alt="Chitkara University"
                >

            </div>


            <!-- HEADING -->

            <div class="register-heading">

                <span>
                    JOIN CAMPUSCONNECT
                </span>

                <h1>
                    Create Your<br>
                    <strong>Account.</strong>
                </h1>

                <p>
                    Create your student account and start
                    making your campus better.
                </p>

            </div>


            <!-- FORM -->

            <form id="registerForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- ROLL NUMBER -->

                <div class="form-group">

                    <label for="roll">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="roll"
                        placeholder="Enter your roll number"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        University Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        maxlength="10"
                        placeholder="Enter 10-digit phone number"
                        required
                    >

                </div>


                <!-- PROFILE PHOTO -->

                <div class="form-group">

                    <label>
                        Profile Picture
                    </label>

                    <div class="photo-upload">


                        <div class="photo-preview">

                            <img
                                id="registerPhotoPreview"
                                src=""
                                alt="Profile Preview"
                            >

                            <span id="photoPlaceholder">
                                +
                            </span>

                        </div>


                        <div class="photo-upload-text">

                            <label
                                for="profilePhoto"
                                class="choose-photo"
                            >
                                Choose Photo
                            </label>

                            <p>
                                JPG or PNG • Maximum 2 MB
                            </p>

                        </div>

                    </div>


                    <input
                        type="file"
                        id="profilePhoto"
                        accept="image/png,image/jpeg"
                        hidden
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword(
                                'password',
                                this
                            )"
                        >
                            Show
                        </button>

                    </div>


                    <div class="password-strength">

                        <div id="strengthBar"></div>

                    </div>


                    <p id="passwordMessage">
                        Use at least 8 characters.
                    </p>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword(
                                'confirm-password',
                                this
                            )"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- TERMS -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">
                                Terms & Conditions
                            </a>
                        </span>

                    </label>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="form-button"
                >
                    Create Account →
                </button>

            </form>


            <!-- LOGIN LINK -->

            <div class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
